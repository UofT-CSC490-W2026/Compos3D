[project]
name = "compos3d"
version = "0.1.0"
description = "Hypothesis-guided controllable procedural 3D scene generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.49",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "ruff>=0.15.1",
    "typer>=0.23.1",
    "pillow>=10.0.0",
    "imageio[ffmpeg]>=2.34.0",
    "matplotlib>=3.10.0",
    "pandas>=2.3.0",
    "wandb>=0.22.0",
]

[project.scripts]
compos3d = "compos3d.cli:app"
compos3d-aws-runtime = "compos3d.aws_runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compos3d"]
