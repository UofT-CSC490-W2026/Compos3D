env: dev
storage_backend: s3
local_lake_root: _lake
aws_region: us-east-1
s3_bucket_bronze: compos3d-dev-bronze
s3_bucket_silver: compos3d-dev-silver
s3_bucket_gold: compos3d-dev-gold
s3_prefix: compos3d
ecr_repository_url:
container_image_tag: latest
aws_secret_env_map:
  WANDB_API_KEY: compos3d-dev-wandb-key
  OPENAI_API_KEY: compos3d-dev-openai-key
  ANTHROPIC_API_KEY: compos3d-dev-anthropic-key
  ANYSCALE_API_KEY: compos3d-dev-anyscale-key
terraform_state_bucket: compos3d-terraform-state
terraform_lock_table: compos3d-terraform-locks
ec2_instance_type: g5.xlarge
ec2_iam_instance_profile: compos3d-dev-ec2-job
ec2_root_volume_size_gb: 300
ec2_log_group: /compos3d/dev/jobs
ec2_spot: true
